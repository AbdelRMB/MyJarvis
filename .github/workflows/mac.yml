# Construit Jarvis pour macOS (puce Apple + Intel) sur les Mac gratuits de GitHub.
# Onglet « Actions » du dépôt > « Jarvis macOS » > Run workflow ; le .dmg est dans « Artifacts » à la fin.
name: Jarvis macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        mac: [macos-14, macos-13]   # macos-14 = Apple Silicon (arm64), macos-13 = Intel (x86_64)
    runs-on: ${{ matrix.mac }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Construire l'appli et le .dmg
        env:
          PYTHON: python
        run: bash construire-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-mac-${{ matrix.mac }}
          path: installateur/*.dmg
          if-no-files-found: error
