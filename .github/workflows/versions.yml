# Fabrique l'installateur de l'AUTRE système et l'ajoute à la release vX.Y.Z (dépôt privé, gratuit).
#
# Lancé automatiquement par publier.py à la fin d'une publication locale :
# - publié depuis un Mac (./publier-mac.sh) -> ce workflow fabrique le .exe Windows et le .dmg de l'autre puce Mac
# - publié depuis Windows (publier.bat)     -> ce workflow fabrique les deux .dmg Mac (Apple Silicon et Intel)
# Quota gratuit : 2000 min/mois. Lancement manuel possible : Actions > Run workflow.
name: Versions de Wesley

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Construire l'installateur Windows"
        type: boolean
        default: false
      mac:
        description: "Construire le .dmg Mac (Apple Silicon)"
        type: boolean
        default: false
      mac_intel:
        description: "Construire le .dmg Mac (Intel)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(grep -E '^VERSION = ' wesley/version.py | cut -d'"' -f2)
          grep -qE "^## $V\b" CHANGELOG.md || { echo "::error::CHANGELOG.md n'a pas de section « ## $V » (description obligatoire)"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      # tests du cœur Python (WESLEY.md, tâches de code, transcription) : quelques secondes, bloquent la construction s'ils échouent
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tests Python du cœur
        run: |
          git config --global user.name "CI Wesley"
          git config --global user.email "ci@example.invalid"
          python -m pip install -q pytest numpy cryptography pypdf requests
          python -m pytest tests -q

  # serveur de comptes + appli du téléphone de bout en bout (iPhone émulé, WebKit) + types de l'interface :
  # une version qui casse le téléphone ou le serveur ne part jamais
  e2e:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: interface/package-lock.json }
      - name: Types de l'interface et appli du téléphone
        run: |
          cd interface && npm ci && npx tsc -p . && npm run build:mobile
      - name: Tests du serveur de comptes
        run: |
          python -m pip install -q -r serveur/requirements.txt pytest httpx requests cryptography playwright
          cd serveur && WESLEY_DB=/tmp/wesley-test.db python -m pytest tests -q
      - name: Téléphone de bout en bout (Playwright, iPhone émulé)
        run: |
          python -m playwright install --with-deps webkit
          cd serveur && (WESLEY_DB=/tmp/wesley-e2e.db WESLEY_CLE_APPLI=cle-e2e python -m uvicorn app:app --port 8765 &) && cd ..
          for i in $(seq 1 30); do curl -sf -H "X-Wesley-Appli: cle-e2e" http://127.0.0.1:8765/v1/sante && break; sleep 1; done
          WESLEY_CAPTURES=/tmp python serveur/tests/e2e_mobile.py

  windows:
    needs: [version, e2e]
    if: inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: interface/package-lock.json }
      - name: Construire et publier WesleySetup.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .venv\Scripts\python -m pip install -q --upgrade pip
          .venv\Scripts\python -m pip install -q -r requirements.txt -r requirements-voix.txt
          Push-Location interface; npm ci; npm run build; Pop-Location
          if (-not (Test-Path voix\fr_FR-tom-medium.onnx)) { .venv\Scripts\python -m piper.download_voices fr_FR-tom-medium --data-dir voix }
          # modèles communs d'openWakeWord (servent au détecteur eveil/hey_wesley.onnx s'il existe)
          .venv\Scripts\python -c "from openwakeword.utils import download_models; download_models(model_names=['hey_wesley'])"
          .venv\Scripts\pyinstaller wesley.spec --noconfirm --log-level WARN
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DVersion=${{ needs.version.outputs.version }}" installateur.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv\Scripts\python publier.py "installateur\WesleySetup-${{ needs.version.outputs.version }}.exe"

  mac:
    needs: [version, e2e]
    if: inputs.mac || inputs.mac_intel
    strategy:
      fail-fast: false
      matrix:
        # macos-15 : Apple Silicon ; macos-15-intel : Mac Intel (macos-13 n'est plus proposé par GitHub)
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # Signature Developer ID + notarisation, si les secrets du dépôt sont définis (sinon : signature ad hoc).
      # Secrets : APPLE_CERT_P12 (certificat « Developer ID Application » exporté en .p12, encodé en base64),
      # APPLE_CERT_MDP (mot de passe du .p12), APPLE_ID, APPLE_MDP_APPLI (mot de passe pour app), APPLE_EQUIPE (Team ID).
      - name: Certificat Apple
        if: (matrix.runner == 'macos-15' && inputs.mac) || (matrix.runner == 'macos-15-intel' && inputs.mac_intel)
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_MDP: ${{ secrets.APPLE_CERT_MDP }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "Pas de certificat dans les secrets : signature ad hoc."; exit 0; fi
          TROUSSEAU="$RUNNER_TEMP/wesley.keychain-db"
          MDP=$(openssl rand -hex 16)
          security create-keychain -p "$MDP" "$TROUSSEAU"
          security set-keychain-settings -lut 21600 "$TROUSSEAU"
          security unlock-keychain -p "$MDP" "$TROUSSEAU"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_MDP" -A -t cert -f pkcs12 -k "$TROUSSEAU"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MDP" "$TROUSSEAU" >/dev/null
          security list-keychains -d user -s "$TROUSSEAU" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$TROUSSEAU"
      - name: Construire et publier le .dmg
        if: (matrix.runner == 'macos-15' && inputs.mac) || (matrix.runner == 'macos-15-intel' && inputs.mac_intel)
        env:
          PYTHON: python
          GH_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_MDP_APPLI: ${{ secrets.APPLE_MDP_APPLI }}
          APPLE_EQUIPE: ${{ secrets.APPLE_EQUIPE }}
        run: |
          bash construire-mac.sh
          .venv-mac/bin/python publier.py "installateur/Wesley-${{ needs.version.outputs.version }}-mac-$(uname -m).dmg"
      - name: Retirer le certificat
        if: ((matrix.runner == 'macos-15' && inputs.mac) || (matrix.runner == 'macos-15-intel' && inputs.mac_intel)) && always()
        run: security delete-keychain "$RUNNER_TEMP/wesley.keychain-db" 2>/dev/null || true
