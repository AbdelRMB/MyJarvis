# Fabrique l'installateur de l'AUTRE système et l'ajoute à la release vX.Y.Z (dépôt privé, gratuit).
#
# Lancé automatiquement par publier.py à la fin d'une publication locale :
# - publié depuis le Mac (./publier-mac.sh)  -> ce workflow fabrique le .exe Windows (~12 min de quota)
# - publié depuis Windows (publier.bat)      -> ce workflow fabrique le .dmg Mac (~70 min de quota, runner x10)
# Quota gratuit : 2000 min/mois. Lancement manuel possible : Actions > Run workflow.
name: Versions de Jarvis

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Construire l'installateur Windows"
        type: boolean
        default: false
      mac:
        description: "Construire le .dmg Mac"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(grep -E '^VERSION = ' jarvis/version.py | cut -d'"' -f2)
          grep -qE "^## $V\b" CHANGELOG.md || { echo "::error::CHANGELOG.md n'a pas de section « ## $V » (description obligatoire)"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    if: inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: interface/package-lock.json }
      - name: Construire et publier JarvisSetup.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .venv\Scripts\python -m pip install -q --upgrade pip
          .venv\Scripts\python -m pip install -q -r requirements.txt -r requirements-voix.txt
          Push-Location interface; npm ci; npm run build; Pop-Location
          if (-not (Test-Path voix\fr_FR-tom-medium.onnx)) { .venv\Scripts\python -m piper.download_voices fr_FR-tom-medium --data-dir voix }
          .venv\Scripts\python -c "from openwakeword.utils import download_models; download_models(model_names=['hey_jarvis'])"
          .venv\Scripts\pyinstaller jarvis.spec --noconfirm --log-level WARN
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DVersion=${{ needs.version.outputs.version }}" installateur.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv\Scripts\python publier.py "installateur\JarvisSetup-${{ needs.version.outputs.version }}.exe"

  mac:
    needs: version
    if: inputs.mac
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Construire et publier le .dmg
        env:
          PYTHON: python
          GH_TOKEN: ${{ github.token }}
        run: |
          bash construire-mac.sh
          .venv-mac/bin/python publier.py "installateur/Jarvis-${{ needs.version.outputs.version }}-mac-$(uname -m).dmg"
