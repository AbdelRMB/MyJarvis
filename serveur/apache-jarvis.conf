# /etc/apache2/sites-available/jarvis.abdelrahimriche.com.conf  (installé par installer-apache.sh)
# API des comptes Jarvis : n'accepte QUE l'appli Jarvis (clé X-Jarvis-Appli) et seulement /v1/… ;
# tout le reste (navigateur, robots, scans) reçoit un 404 sans rien révéler.
<VirtualHost *:80>
    ServerName jarvis.abdelrahimriche.com
    Redirect permanent / https://jarvis.abdelrahimriche.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName jarvis.abdelrahimriche.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/jarvis.abdelrahimriche.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jarvis.abdelrahimriche.com/privkey.pem

    # pas de bannière de version, pas de mise en cache, pas d'intégration dans une page
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Cache-Control "no-store"
    Header always set Strict-Transport-Security "max-age=31536000"
    LimitRequestBody 20971520

    RewriteEngine On
    # 1) seulement les méthodes de l'API
    RewriteCond %{REQUEST_METHOD} !^(GET|POST|PUT)$
    RewriteRule ^ - [R=404,L]
    # 2) seulement /v1/…
    RewriteCond %{REQUEST_URI} !^/v1/
    RewriteRule ^ - [R=404,L]
    # 3) seulement l'appli Jarvis (clé d'appli)
    RewriteCond %{HTTP:X-Jarvis-Appli} !=5l4xUaEzf2zcv9N56ZrvDH6Lo8MGCGgwqtTcnzeiK-w
    RewriteRule ^ - [R=404,L]

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /v1/ http://127.0.0.1:8020/v1/
    ProxyPassReverse /v1/ http://127.0.0.1:8020/v1/
    ProxyTimeout 120

    ErrorLog ${APACHE_LOG_DIR}/jarvis_error.log
    CustomLog ${APACHE_LOG_DIR}/jarvis_access.log combined
</VirtualHost>
