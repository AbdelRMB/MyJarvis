# Serveur des comptes Jarvis. Déploiement : voir serveur/README.md
services:
  jarvis-comptes:
    build: .
    container_name: jarvis-comptes
    restart: unless-stopped
    ports:
      - "127.0.0.1:8020:8000"     # accessible uniquement par Apache (HTTPS) sur le VPS
    environment:
      - JARVIS_CLE_APPLI=${JARVIS_CLE_APPLI:?clé de l'appli manquante dans serveur/.env}
    volumes:
      - donnees:/donnees
volumes:
  donnees:
